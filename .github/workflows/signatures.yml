name: Signatures

# Publishes the detection signature feed: a signed .agsig package built from
# signatures/catalog.json, attached to the rolling "signatures" GitHub release.
# Installed apps poll latest.json from that release and only load a package
# that verifies against the public key compiled into SignatureStore.cs.

on:
  push:
    branches: [master]
    paths:
      - "signatures/**"
      - ".github/workflows/signatures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signatures
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      # Gate: a malformed, duplicate, or shrunken catalog never ships.
      - name: Build and test
        run: |
          dotnet build AgrusScanner.sln -c Release
          dotnet test AgrusScanner.sln -c Release --no-build --verbosity normal

      - name: Compute versions
        id: ver
        shell: pwsh
        run: |
          $sig = "{0}.{1}" -f (Get-Date -AsUTC -Format "yyyy.MM.dd"), $env:GITHUB_RUN_NUMBER
          $app = ([xml](Get-Content AgrusScanner/AgrusScanner.csproj)).Project.PropertyGroup.Version
          $pub = (Select-String -Path AgrusScanner/Services/SignatureStore.cs -Pattern '\["k1"\]\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $aes = (Select-String -Path AgrusScanner/Services/SignatureStore.cs -Pattern 'FromBase64String\("([^"]+)"\)').Matches[0].Groups[1].Value
          "sig=$sig"  >> $env:GITHUB_OUTPUT
          "app=$app"  >> $env:GITHUB_OUTPUT
          "pub=$pub"  >> $env:GITHUB_OUTPUT
          "aes=$aes"  >> $env:GITHUB_OUTPUT
          Write-Host "sigVersion=$sig minAppVersion=$app"

      # Secrets are passed as env:NAME so they never appear on a command line.
      - name: Pack and sign
        shell: pwsh
        env:
          AGSIG_SIGNING_KEY: ${{ secrets.AGSIG_SIGNING_KEY }}
          AGSIG_AES_KEY: ${{ secrets.AGSIG_AES_KEY }}
        run: |
          $tool = "AgrusScanner.SigTool/bin/Release/net9.0/AgrusScanner.SigTool.exe"
          & $tool pack signatures/catalog.json --version "${{ steps.ver.outputs.sig }}" --min-app "${{ steps.ver.outputs.app }}" --key env:AGSIG_SIGNING_KEY --aes env:AGSIG_AES_KEY --out latest.agsig
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Verify with the public key AND AES key compiled into the app (not the secrets): catches any
          # secret/embedded-key mismatch before anything is published.
          $env:APP_AES_KEY = "${{ steps.ver.outputs.aes }}"
          & $tool verify latest.agsig --pub "${{ steps.ver.outputs.pub }}" --aes env:APP_AES_KEY
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Write manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash latest.agsig -Algorithm SHA256).Hash.ToLower()
          $count = (Get-Content signatures/catalog.json -Raw | ConvertFrom-Json).probes.Count
          @{
            sig_version     = "${{ steps.ver.outputs.sig }}"
            min_app_version = "${{ steps.ver.outputs.app }}"
            sha256          = $sha
            probe_count     = $count
            url             = "https://github.com/${{ github.repository }}/releases/download/signatures/latest.agsig"
            published       = (Get-Date -AsUTC -Format "o")
            commit          = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publish to the rolling "signatures" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view signatures --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create signatures --repo ${{ github.repository }} --prerelease --title "Detection signatures (rolling)" `
              --notes "Rolling feed of detection signatures for Agrus Scanner. The app downloads latest.agsig automatically; it is signed and cannot be installed by hand. This release is updated in place and is not an app release."
          }
          gh release upload signatures latest.agsig latest.json --repo ${{ github.repository }} --clobber
          gh release edit signatures --repo ${{ github.repository }} --notes "Rolling feed of detection signatures for Agrus Scanner. Current: ${{ steps.ver.outputs.sig }} (built from ${{ github.sha }}). The app downloads latest.agsig automatically; it is signed and cannot be installed by hand. This release is updated in place and is not an app release."
