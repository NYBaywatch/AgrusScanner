name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-msi-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Gate: the release aborts here if the build or catalog tests fail.
      - name: Build and test
        run: |
          dotnet build AgrusScanner.sln -c Release
          dotnet test AgrusScanner.sln -c Release --no-build --verbosity normal

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      # Signing happens inside build-installer.ps1: app exe/dll after publish, MSI after packing.
      # Gate: no release ships unsigned. Credentials are managed in Doppler
      # (agrusscanner/prd) and synced to these repo secrets automatically.
      - name: Build and sign MSI (Azure Trusted Signing)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AGRUS_SIGNING_ENDPOINT: ${{ secrets.AGRUS_SIGNING_ENDPOINT }}
          AGRUS_SIGNING_ACCOUNT: ${{ secrets.AGRUS_SIGNING_ACCOUNT }}
          AGRUS_SIGNING_PROFILE: ${{ secrets.AGRUS_SIGNING_PROFILE }}
        run: |
          dotnet tool install --global sign --prerelease
          .\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed" }

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @("Installer\publish\AgrusScanner.exe", "Installer\publish\AgrusScanner.dll") + (Get-ChildItem "Installer\bin\Release" -Filter "*.msi" -Recurse | ForEach-Object FullName)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid") { throw "Unsigned or invalid signature: $f ($($sig.Status)) - aborting release" }
            Write-Host "$(Split-Path $f -Leaf): signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Verify tag matches csproj version
        shell: pwsh
        run: |
          $csprojVersion = ([xml](Get-Content AgrusScanner/AgrusScanner.csproj)).Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ("$csprojVersion".Trim() -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match csproj version $csprojVersion"
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem "Installer\bin\Release" -Filter "*.msi" -Recurse | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $msi.FullName `
            --title "Agrus Scanner ${{ github.ref_name }}" `
            --generate-notes
