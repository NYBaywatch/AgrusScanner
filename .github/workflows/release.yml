name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-msi-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      # Gate: the release aborts here if the build or catalog tests fail.
      - name: Build and test
        run: |
          dotnet build AgrusScanner.sln -c Release
          dotnet test AgrusScanner.sln -c Release --no-build --verbosity normal

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      # Signing happens inside build-installer.ps1: app exe/dll after publish, MSI after packing.
      # Gate: no release ships unsigned. Credentials are managed in Doppler
      # (agrusscanner/prd) and synced to these repo secrets automatically.
      - name: Build and sign MSI (Azure Trusted Signing)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AGRUS_SIGNING_ENDPOINT: ${{ secrets.AGRUS_SIGNING_ENDPOINT }}
          AGRUS_SIGNING_ACCOUNT: ${{ secrets.AGRUS_SIGNING_ACCOUNT }}
          AGRUS_SIGNING_PROFILE: ${{ secrets.AGRUS_SIGNING_PROFILE }}
        run: |
          dotnet tool install --global sign --prerelease
          .\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed" }

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @("Installer\publish\AgrusScanner.exe", "Installer\publish\AgrusScanner.dll") + (Get-ChildItem "Installer\bin\Release" -Filter "*.msi" -Recurse | ForEach-Object FullName)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid") { throw "Unsigned or invalid signature: $f ($($sig.Status)) - aborting release" }
            Write-Host "$(Split-Path $f -Leaf): signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Verify tag matches csproj version
        shell: pwsh
        run: |
          $csprojVersion = ([xml](Get-Content AgrusScanner/AgrusScanner.csproj)).Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ("$csprojVersion".Trim() -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match csproj version $csprojVersion"
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem "Installer\bin\Release" -Filter "*.msi" -Recurse | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $msi.FullName `
            --title "Agrus Scanner ${{ github.ref_name }}" `
            --generate-notes

      # Mirrors the MSI to R2 (agrus-downloads bucket) as both a versioned
      # filename and a rolling "latest" filename, so jpftech.com/tools/ always
      # has a stable download link. Skipped without failing the release when
      # the Cloudflare secrets aren't configured yet (see docs/launch-v1.0.md
      # "To do" for setup steps).
      - name: Prepare R2 upload
        id: r2_check
        shell: pwsh
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $msi = Get-ChildItem "Installer\bin\Release" -Filter "*.msi" -Recurse | Select-Object -First 1
          $version = "${{ github.ref_name }}".TrimStart("v")
          $rolling = Join-Path (Get-Location) "Installer\bin\Release\AgrusScanner-Setup.msi"
          if ($msi.FullName -ne $rolling) { Copy-Item $msi.FullName $rolling }
          "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "rolling_path=$rolling" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          if ([string]::IsNullOrEmpty($env:HAS_CF_TOKEN)) {
            Write-Host "::notice::CLOUDFLARE_API_TOKEN secret not set - skipping R2 upload. See docs/launch-v1.0.md for setup steps."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload MSI to R2 (versioned)
        if: steps.r2_check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put agrus-downloads/AgrusScanner-Setup-${{ steps.r2_check.outputs.version }}.msi --file "${{ steps.r2_check.outputs.msi_path }}" --content-type application/octet-stream --remote

      - name: Upload MSI to R2 (rolling latest)
        if: steps.r2_check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put agrus-downloads/AgrusScanner-Setup.msi --file "${{ steps.r2_check.outputs.rolling_path }}" --content-type application/octet-stream --remote
