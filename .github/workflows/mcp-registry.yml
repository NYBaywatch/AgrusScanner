name: MCP image and registry

# Builds the headless MCP server image from the root Dockerfile and checks that it answers an
# MCP initialize request. On a version tag (or a manual run from master) it also pushes the
# image to ghcr.io, signs it, and publishes server.json to registry.modelcontextprotocol.io
# through GitHub OIDC, so no registry secret is stored in this repo.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - "server.json"
      - "AgrusScanner.McpServer/**"
      - ".github/workflows/mcp-registry.yml"
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/nybaywatch/agrus-mcp
  MCP_PUBLISHER_VERSION: v1.8.1
  # Publish only from a version tag or master, never from a PR or a manual run on another branch.
  PUBLISH: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master') }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # OIDC login to the MCP registry and keyless image signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' AgrusScanner/AgrusScanner.csproj | head -n1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg "VERSION=$VERSION" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Smoke test (MCP initialize over stdio)
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          # Keep stdin open briefly: the server exits on EOF and may not answer if it closes at once.
          out=$( (printf '%s\n' "$req"; sleep 10) | timeout 60 docker run -i --rm "$IMAGE:$VERSION" || true)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'

      - name: Check server.json
        run: jq -e '.name and .version and .packages[0].identifier' server.json

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push and sign image
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          # Immutable reference (ghcr.io/...@sha256:...) for signing and for the registry entry.
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          [[ "$DIGEST_REF" =~ ^ghcr\.io/nybaywatch/agrus-mcp@sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $DIGEST_REF"; exit 1; }
          cosign sign --yes "$DIGEST_REF"
          echo "DIGEST_REF=$DIGEST_REF" >> "$GITHUB_ENV"

      - name: Download and verify mcp-publisher
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # The registry reads the image label anonymously, so the ghcr.io package must be public.
      - name: Publish to the MCP registry
        if: env.PUBLISH == 'true'
        run: |
          jq --arg v "$VERSION" --arg id "$DIGEST_REF" \
            '.version = $v | .packages[0].identifier = $id' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
